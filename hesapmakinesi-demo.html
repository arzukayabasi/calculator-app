  <style>
    :root {
      --ink: #10182f;
      --panel: #17213e;
      --panel-deep: #0c1328;
      --mist: #dbe7ff;
      --soft: #8da1c8;
      --orange: #ff8d4b;
      --blue: #4e7dff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "DM Sans", sans-serif;
      color: var(--mist);
    }

    .calculator-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow: hidden;
      position: relative;
    }

    .calculator-shell::before,
    .calculator-shell::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(2px);
      pointer-events: none;
    }

    .calculator-shell::before {
      width: 360px;
      height: 360px;
      top: -145px;
      left: -115px;
      background: radial-gradient(circle, rgba(78, 125, 255, 0.3), transparent 69%);
    }

    .calculator-shell::after {
      width: 400px;
      height: 400px;
      right: -170px;
      bottom: -170px;
      background: radial-gradient(circle, rgba(255, 141, 75, 0.23), transparent 70%);
    }

    .calculator-device {
      width: min(100%, 410px);
      position: relative;
      z-index: 1;
      padding: 24px;
      border: 1px solid rgba(219, 231, 255, 0.13);
      border-radius: 34px;
      background: rgba(23, 33, 62, 0.88);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: settle 0.65s cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    .display-panel {
      min-height: 150px;
      border-radius: 24px;
      padding: 20px;
      background: var(--panel-deep);
      border: 1px solid rgba(219, 231, 255, 0.07);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .history-display {
      min-height: 24px;
      color: var(--soft);
      font: 400 14px/1.5 "Space Mono", monospace;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .result-display {
      color: #f6f9ff;
      font: 700 clamp(2.25rem, 10vw, 3.75rem)/1.15 "Space Mono", monospace;
      letter-spacing: -0.07em;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
      margin-top: 18px;
    }

    .calc-key {
      min-height: 62px;
      border: 1px solid rgba(219, 231, 255, 0.08);
      border-radius: 18px;
      background: #202d50;
      color: #f2f6ff;
      cursor: pointer;
      font-family: "DM Sans", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 5px 12px rgba(0, 0, 0, 0.13);
    }

    .calc-key:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }

    .calc-key:active {
      transform: translateY(1px) scale(0.98);
    }

    .calc-key:focus-visible {
      outline: 3px solid #b8cbff;
      outline-offset: 3px;
    }

    .calc-key.utility {
      background: #29385e;
    }

    .calc-key.operator {
      background: #314a84;
      color: #dce6ff;
    }

    .calc-key.equal {
      background: var(--orange);
      color: #28130a;
    }

    .calc-key.zero {
      grid-column: span 2;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--orange);
      box-shadow: 0 0 15px rgba(255, 141, 75, 0.85);
    }

    .key-grid .calc-key {
      animation: key-in 0.45s ease both;
    }

    .key-grid .calc-key:nth-child(1) { animation-delay: 0.05s; }
    .key-grid .calc-key:nth-child(2) { animation-delay: 0.08s; }
    .key-grid .calc-key:nth-child(3) { animation-delay: 0.11s; }
    .key-grid .calc-key:nth-child(4) { animation-delay: 0.14s; }
    .key-grid .calc-key:nth-child(5) { animation-delay: 0.17s; }
    .key-grid .calc-key:nth-child(6) { animation-delay: 0.20s; }
    .key-grid .calc-key:nth-child(7) { animation-delay: 0.23s; }
    .key-grid .calc-key:nth-child(8) { animation-delay: 0.26s; }

    @keyframes settle {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes key-in {
      from {
        opacity: 0;
        transform: translateY(9px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 390px) {
      .calculator-device {
        padding: 18px;
        border-radius: 28px;
      }

      .calc-key {
        min-height: 56px;
        border-radius: 15px;
      }

      .display-panel {
        min-height: 132px;
      }
    }
  </style>

  <script src="/_sdk/d97541380e824b1a.editing_sdk.js" integrity="sha512-iBVkuiyctyjmaqUwrsoYSc/nxwymdEKZMKPeBCNj6uN/7hFPTiMVeunYJjJVnUh1GNECKEyCerl7IHtlqhzSYQ=="></script>
  <script>
    const resultDisplay = document.getElementById("result-display");
    const historyDisplay = document.getElementById("history-display");

    let currentValue = "0";
    let previousValue = null;
    let operator = null;
    let waitingForOperand = false;
    let justCalculated = false;

    const operatorSymbols = {
      "+": "+",
      "-": "−",
      "*": "×",
      "/": "÷"
    };

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "Hata";
      const rounded = Number.parseFloat(Number(value).toPrecision(12));
      return String(rounded).replace(".", ",");
    }

    function normalizedValue(value) {
      return Number.parseFloat(String(value).replace(",", "."));
    }

    function updateDisplay() {
      resultDisplay.textContent = currentValue === "Hata" ? "Hata" : currentValue.replace(".", ",");

      if (previousValue !== null && operator) {
        historyDisplay.textContent = `${formatNumber(previousValue)} ${operatorSymbols[operator]}`;
      } else {
        historyDisplay.textContent = "";
      }
    }

    function resetCalculator() {
      currentValue = "0";
      previousValue = null;
      operator = null;
      waitingForOperand = false;
      justCalculated = false;
      updateDisplay();
    }

    function inputNumber(number) {
      if (currentValue === "Hata" || justCalculated || waitingForOperand) {
        currentValue = number;
        waitingForOperand = false;
        justCalculated = false;
      } else {
        currentValue = currentValue === "0" ? number : currentValue + number;
      }

      updateDisplay();
    }

    function inputDecimal() {
      if (currentValue === "Hata" || justCalculated || waitingForOperand) {
        currentValue = "0.";
        waitingForOperand = false;
        justCalculated = false;
      } else if (!currentValue.includes(".")) {
        currentValue += ".";
      }

      updateDisplay();
    }

    function calculate(first, second, operation) {
      if (operation === "+") return first + second;
      if (operation === "-") return first - second;
      if (operation === "*") return first * second;
      if (operation === "/") return second === 0 ? null : first / second;
      return second;
    }

    function showDivisionError() {
      currentValue = "Hata";
      previousValue = null;
      operator = null;
      waitingForOperand = true;
      justCalculated = true;
      historyDisplay.textContent = "Sıfıra bölme yapılamaz";
      resultDisplay.textContent = "Hata";
    }

    function chooseOperator(nextOperator) {
      if (currentValue === "Hata") {
        resetCalculator();
        return;
      }

      const inputValue = normalizedValue(currentValue);

      if (operator && waitingForOperand) {
        operator = nextOperator;
        updateDisplay();
        return;
      }

      if (previousValue === null) {
        previousValue = inputValue;
      } else if (operator) {
        const computed = calculate(previousValue, inputValue, operator);

        if (computed === null) {
          showDivisionError();
          return;
        }

        currentValue = String(computed);
        previousValue = computed;
      }

      operator = nextOperator;
      waitingForOperand = true;
      justCalculated = false;
      updateDisplay();
    }

    function performCalculation() {
      if (!operator || previousValue === null || currentValue === "Hata") return;

      const secondValue = normalizedValue(currentValue);
      const calculatedOperator = operator;
      const computed = calculate(previousValue, secondValue, calculatedOperator);
      const readableHistory = `${formatNumber(previousValue)} ${operatorSymbols[calculatedOperator]} ${formatNumber(secondValue)} =`;

      if (computed === null) {
        showDivisionError();
        return;
      }

      currentValue = String(computed);
      previousValue = null;
      operator = null;
      waitingForOperand = true;
      justCalculated = true;
      historyDisplay.textContent = readableHistory;
      resultDisplay.textContent = currentValue.replace(".", ",");
    }

    function toggleSign() {
      if (currentValue === "0" || currentValue === "Hata") return;

      currentValue = String(normalizedValue(currentValue) * -1);
      updateDisplay();
    }

    function applyPercent() {
      if (currentValue === "Hata") return;

      currentValue = String(normalizedValue(currentValue) / 100);
      updateDisplay();
    }

    function backspace() {
      if (waitingForOperand || currentValue === "Hata") return;

      currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : "0";

      if (currentValue === "-" || currentValue === "") {
        currentValue = "0";
      }

      updateDisplay();
    }

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        const { action, value } = button.dataset;

        if (action === "number") inputNumber(value);
        if (action === "decimal") inputDecimal();
        if (action === "operator") chooseOperator(value);
        if (action === "equals") performCalculation();
        if (action === "clear") resetCalculator();
        if (action === "sign") toggleSign();
        if (action === "percent") applyPercent();
      });
    });

    document.addEventListener("keydown", (event) => {
      const key = event.key;

      if (/^\d$/.test(key)) {
        inputNumber(key);
      } else if (key === "." || key === ",") {
        inputDecimal();
      } else if (["+", "-", "*", "/"].includes(key)) {
        event.preventDefault();
        chooseOperator(key);
      } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        performCalculation();
      } else if (key === "Escape") {
        resetCalculator();
      } else if (key === "Backspace") {
        event.preventDefault();
        backspace();
      }
    });

    if (window.lucide) {
      lucide.createIcons();
    }

    updateDisplay();
  </script>
